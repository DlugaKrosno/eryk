modules:
  # Smart Page - automatycznie wykrywa kontekst i pokazuje formularz lub admin
  jira:projectPage:
    - key: incident-reporter-project
      resource: smart-page
      resolver:
        function: resolver
      title: drEryk Alert

  # Konfiguracja aplikacji: Ustawienia Jiry -> Aplikacje (tylko administratorzy Jiry)
  jira:adminPage:
    - key: incident-reporter-admin
      resource: smart-page
      resolver:
        function: resolver
      title: drEryk Alert - konfiguracja

  # Formularz alertu z wyborem projektu (Twoje aplikacje)
  jira:globalPage:
    - key: incident-reporter-global
      resource: smart-page
      resolver:
        function: resolver
      title: drEryk Alert

  # Backend Functions
  function:
    # Webtrigger SLA (odpowiedź HTTP)
    - key: slaWebTrigger
      handler: index.slaWebTrigger

    # Trigger utworzenia alertu
    - key: issueCreatedTrigger
      handler: index.issueCreatedTrigger

    # Resolver dla Custom UI
    - key: resolver
      handler: index.handler

    # Create Incident
    - key: createIncident
      handler: index.handler

    # Get Config
    - key: getConfig
      handler: index.handler

    # Save Config
    - key: saveConfig
      handler: index.handler

    # Get My Incidents
    - key: getMyIncidents
      handler: index.handler

    # Get Audit Log
    - key: getAuditLog
      handler: index.handler

    # Get Projects
    - key: getProjects
      handler: index.handler

    # Get Project Issue Types
    - key: getProjectIssueTypes
      handler: index.handler

    # Get Issue Type Fields
    - key: getIssueTypeFields
      handler: index.handler

    # Get Project Users
    - key: getProjectUsers
      handler: index.handler

    # Get Current Team And Assignee
    - key: getCurrentTeam
      handler: index.handler

    # Get Project Config
    - key: getProjectConfig
      handler: index.handler

    # Save Project Config
    - key: saveProjectConfig
      handler: index.handler

    # Get Context
    - key: getContext
      handler: index.handler

    # Get Statistics
    - key: getStatistics
      handler: index.handler

    # Scheduled SLA Check (call via webtrigger or external scheduler)
    - key: scheduledSLACheck
      handler: index.scheduledSLACheck

    # Get Project Name
    - key: getProjectName
      handler: index.handler

    # Get Configured Projects
    - key: getConfiguredProjects
      handler: index.handler

    # Get Issues For Recalculation
    - key: getIssuesForRecalc
      handler: index.handler

    # Reprocess Selected Issues
    - key: reprocessSelectedIssues
      handler: index.handler

    # Test Teams Webhook
    - key: testTeamsWebhook
      handler: index.handler

  # Webtrigger - Manual or external SLA check
  webtrigger:
    - key: sla-check-trigger
      function: slaWebTrigger

  # Cykliczne sprawdzanie SLA (co godzinę; przetwarza tylko projekty z aktywnymi regułami)
  scheduledTrigger:
    - key: sla-hourly-check
      function: scheduledSLACheck
      interval: hour

  # Trigger - Auto-process on issue creation (osobna funkcja, nie resolver)
  trigger:
    - key: incident-created-trigger
      function: issueCreatedTrigger
      events:
        - avi:jira:created:issue

resources:
  - key: smart-page
    path: static/smart/build

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/14fb3225-4487-4c53-a8be-b887754173fa

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.webhook.office.com"
        - address: "*.logic.azure.com"
        - address: "*.powerplatform.com"
